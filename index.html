<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snomo Asset Management — SNMG · SNBZ</title>
<style>
:root{
  --bg:#0A0E16; --panel:#111827; --panel2:#0D1420; --line:#1E293C;
  --ink:#E9EFFA; --muted:#8DA0BC; --nav:#5EE6D0; --blitz:#FFB454;
  --pos:#4ADE80; --neg:#F87171; --qqq:#7C8FFF; --spy:#98A4BC;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--nav)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)}.neg{color:var(--neg)}.flat{color:var(--muted)}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(10,14,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.wordmark{font-weight:800;letter-spacing:.18em;font-size:18px}
.wordmark .dot{color:var(--nav)}
.hmeta{text-align:right;font-size:12px;color:var(--muted);line-height:1.4}
.hmeta .asof{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-top:2px;color:var(--ink)}
nav.tabs{display:flex;gap:8px;padding:0 0 12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:22px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .15s}
.tab.active[data-tab="growth"]{border-color:var(--nav);color:var(--nav)}
.tab.active[data-tab="blitz"]{border-color:var(--blitz);color:var(--blitz)}
.tab.active[data-tab="ops"]{border-color:var(--ink);color:var(--ink)}
.tab .tk{font-family:var(--mono)}

/* hero */
.hero{padding:34px 0 10px}
.hero .tickchip{display:inline-block;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.12em;border:1px solid;border-radius:6px;padding:3px 10px;margin-bottom:10px}
.hero h1{font-size:clamp(26px,4.5vw,40px);font-weight:800;letter-spacing:-.01em}
.hero .tagline{color:var(--muted);font-size:16px;margin-top:4px;max-width:760px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0 8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:3px}
.stat .v{font-size:19px;font-weight:700}
.stat .s{font-size:12px;color:var(--muted)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:18px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-bottom:14px}
.panel .h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.obj{font-size:15.5px;color:#C7D3E6;max-width:900px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.fact .v{font-size:14px;font-weight:600;margin-top:2px}

/* chart */
.chartbox{position:relative}
canvas#perf{width:100%;height:340px;display:block}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:18px;padding:4px 12px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;transition:opacity .15s}
.chip .sw{width:10px;height:10px;border-radius:3px}
.chip.off{opacity:.35}
.chip.locked{cursor:default}
.tooltip{position:absolute;pointer-events:none;background:#0B1220;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:none;z-index:5;min-width:130px}
.tooltip .d{color:var(--muted);font-size:11px;margin-bottom:4px}
.tooltip .r{display:flex;justify-content:space-between;gap:12px}
.empty-note{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.empty-note .card{background:var(--panel2);border:1px dashed var(--line);border-radius:12px;padding:16px 22px;color:var(--muted);font-size:14px;max-width:460px}.empty-note .card b{color:var(--ink)}

/* holdings table */
table.holdings{width:100%;border-collapse:collapse}
.holdings th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
.holdings th .arr{opacity:.5;font-size:9px}
.holdings td{padding:10px;border-bottom:1px solid #16202f;font-size:14.5px;vertical-align:top}
.holdings tr:last-child td{border-bottom:none}
.holdings .tk{font-family:var(--mono);font-weight:700}
.holdings .wt{font-family:var(--mono);white-space:nowrap}
.wbar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-right:8px}
.tandr{display:flex;align-items:center;gap:8px}
.analysts{display:flex;gap:4px;flex-wrap:wrap}
.av{min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;letter-spacing:.02em}
.tr-total td{border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}

/* sectors */
.sector{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;margin-bottom:9px;font-size:13.5px}
.sector .bar{height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
.sector .bar i{display:block;height:100%;border-radius:5px}
.sector .pc{font-family:var(--mono);text-align:right;color:var(--muted)}

/* sprint strip */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.day{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px}
.day .dl{font-family:var(--mono);font-weight:700;font-size:12px;margin-bottom:6px}
.day ul{list-style:none}
.day li{margin-bottom:5px;color:#B9C6DA;line-height:1.4;padding-left:12px;position:relative}
.day li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--blitz);opacity:.7}

/* sprint record */
.sprrec{width:100%;border-collapse:collapse}
.sprrec th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.sprrec td{padding:10px;border-bottom:1px solid #16202f;font-size:14px;vertical-align:top}
.sprrec tr:last-child td{border-bottom:none}
.sprrec .wklbl{color:var(--muted);font-size:12px}
.sprrec .live-tag{display:inline-block;border:1px solid var(--blitz);color:var(--blitz);border-radius:10px;padding:0 8px;font-size:10.5px;font-weight:700;letter-spacing:.06em;margin-left:6px;vertical-align:middle}
@media (max-width:720px){.sprrec th:nth-child(5),.sprrec td:nth-child(5),.sprrec th:nth-child(6),.sprrec td:nth-child(6){display:none}}

/* fees */
.feegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.feecomp{margin-top:14px}
.feecomp .row{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.feecomp .bar{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.feecomp .bar i{display:block;height:100%}
.feecomp .pc{font-family:var(--mono);text-align:right}
.feestar{font-size:12px;color:var(--muted);margin-top:10px}

/* ops */
.opspipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opstep{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13.5px}
.opstep .t{font-weight:700;margin-bottom:4px}
.opstep .d{color:var(--muted);font-size:12.5px}
.opstep .id{font-family:var(--mono);font-size:11px;color:var(--nav);margin-top:6px;display:block}
.costtable{width:100%;border-collapse:collapse;font-size:14px}
.costtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px;border-bottom:1px solid var(--line)}
.costtable td{padding:9px 8px;border-bottom:1px solid #16202f}
.costtable td:last-child,.costtable th:last-child{text-align:right;font-family:var(--mono)}
.costtable tr.total td{border-top:1px solid var(--line);font-weight:700}

/* footer */
footer{border-top:1px solid var(--line);margin-top:36px;padding:22px 0 40px;color:var(--muted);font-size:12.5px}
footer .fn{margin-bottom:6px;line-height:1.5}

@media (max-width:720px){
  .holdings th:nth-child(4),.holdings td:nth-child(4),.holdings th:nth-child(6),.holdings td:nth-child(6){display:none}
  .feegrid{grid-template-columns:1fr}
  .week{grid-template-columns:1fr}
  .sector{grid-template-columns:120px 1fr 48px}
  .hmeta{display:none}
}
@media (max-width:560px){
  .holdings th:nth-child(3),.holdings td:nth-child(3){display:none}
  canvas#perf{height:260px}
  .empty-note{padding:10px 10px 10px 44px}
}
</style>

const dateLbl = iso => { const d=new Date(iso+'T12:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
const accentOf = f => f.id==='growth' ? getComputedStyle(document.documentElement).getPropertyValue('--nav').trim() : getComputedStyle(document.documentElement).getPropertyValue('--blitz').trim();

let CHART = null;

/* ---------- router ---------- */
let CURRENT=null;
function routeTo(h){
  if(h!=='ops' && !CAT.funds.some(f=>f.id===h)) h = CAT.funds[0].id;
  if(CURRENT===h) return;
  CURRENT=h;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===h));
  if(h==='ops') renderOps(); else renderFund(CAT.funds.find(f=>f.id===h));
  window.scrollTo(0,0);
}
// Render FIRST, then try the hash — embedded webviews (Slack iOS file preview)
// can block or silently drop hash navigations; tabs must never depend on them.
function go(id){
  routeTo(id);
  try{ if(location.hash!=='#'+id) location.hash=id; }catch(e){}
}
function route(){
  routeTo(location.hash.replace('#','') || CAT.funds[0].id);
}

function init(){
  $('#firm-tag').textContent = CAT.firm.tagline;
  $('#asof').textContent = CAT.as_of_label;
  const tabs = $('#tabs');
  CAT.funds.forEach(f=>{
    const b=document.createElement('button');
    b.className='tab'; b.dataset.tab=f.id;
    b.innerHTML = `<span class="tk">${f.ticker}</span> &nbsp;${esc(f.name.replace('Snomo ',''))}`;
    b.onclick=()=>go(f.id);
    tabs.appendChild(b);
  });
  const ob=document.createElement('button');
  ob.className='tab'; ob.dataset.tab='ops'; ob.textContent='Firm & Ops';
  ob.onclick=()=>go('ops');
  tabs.appendChild(ob);
  window.addEventListener('hashchange',route);
  route();
}

function latestStats(f){
  const H=f.history;
  if(!H.length) return {nav:f.baseline_nav??100, ret:null, vsq:null, vss:null, date:f.baseline_date};
  const L=H[H.length-1];
  return {nav:L.nav, ret:L.nav_return_pct, vsq:L.vs_qqq_pct, vss:L.vs_spy_pct, date:L.date,
          best:L.movers?.best, worst:L.movers?.worst};
}

function renderHoldings(f, pending){
  const ac=accentOf(f), tbl=$('#holdtbl');
  const hasCat = f.id==='blitz';
  const sortState={k:'weight',desc:true};
  function sortedRows(){
    const k=sortState.k;
    const rows=[...f.holdings];
    rows.sort((a,b)=>{
      let va=a[k], vb=b[k];
      if(k==='weight') return (vb-va);
      if(k==='analysts'){ return vb.length-va.length || String(a.ticker).localeCompare(b.ticker); }
      return String(va).localeCompare(String(vb));
    });
    if(!sortState.desc && k!=='weight') rows.reverse();
    return rows;
  }
  function render(){
    const rows=sortedRows();
    const headers=[
      ['ticker','Ticker'],['name','Company'],['weight','Weight'],['sector','Sector'],
      ...(hasCat?[['catalyst','Catalyst']]:[]),['analysts','Analysts']
    ];
    let html='<tr>'+headers.map(([k,l])=>`<th data-k="${k}" style="${k==='weight'?'text-align:right':''}">${l} <span class="arr">↕</span></th>`).join('')+'</tr>';
    rows.forEach(h=>{
      const bw = Math.max(2, Math.round(h.weight*4));
      html += `<tr>
        <td class="tk">${esc(h.ticker)}</td>
        <td>${esc(h.name)}</td>
        <td class="wt" style="text-align:right"><span class="tandr"><span class="wbar" style="width:${bw}px;background:${ac}"></span>${fmt(h.weight,1)}%</span></td>
        <td>${esc(h.sector)}</td>
        ${hasCat?`<td style="font-size:13px;color:#B9C6DA">${esc(h.catalyst||'')}</td>`:''}
        <td><span class="analysts">${(h.analysts||[]).map(a=>`<span class="av" title="${esc(a)}">${esc(a==='Chip'?'Ch':a==='CFO'?'CF':a==='PM'?'PM':a[0])}</span>`).join('')}</span></td></tr>`;
    });
    html += `<tr class="tr-total"><td colspan="2">Total — ${rows.length} positions</td><td class="wt" style="text-align:right">${fmt(rows.reduce((a,b)=>a+b.weight,0),1)}%</td><td colspan="${hasCat?3:2}">${pending?'first NAV marks tonight 6:00 PM ET':'daily marks at each market close'}</td></tr>`;
    tbl.innerHTML=html;
    tbl.querySelectorAll('th[data-k]').forEach(th=>{
      th.onclick=()=>{
        const k=th.dataset.k;
        if(sortState.k===k) sortState.desc=!sortState.desc; else {sortState.k=k; sortState.desc=true;}
        render();
      };
    });
  }
  render();
}

/* ---------- chart ---------- */
function renderChart(f){
  const mount=$('#chartmount');
  const series={NAV:true,QQQ:true,SPY:false};
  const colors={NAV:accentOf(f)};
  f.benchmarks.forEach(b=>{if(b.ticker!=='NAV')colors[b.ticker]=b.color;});
  mount.innerHTML=`
    <div class="legend">
      <span class="chip" data-s="NAV"><span class="sw" style="background:${colors.NAV}"></span>${f.ticker} NAV</span>
      ${f.benchmarks.filter(b=>b.ticker!=='NAV').map(b=>`<span class="chip" data-s="${b.ticker}"><span class="sw" style="background:${b.color}"></span>${esc(b.label)}</span>`).join('')}
    </div>
    <div class="chartbox"><canvas id="perf"></canvas><div class="tooltip" id="tip"></div>
      ${!f.history.length?`<div class="empty-note"><div class="card"><b>Baseline day — the fund is 0 days old.</b><br>NAV starts at 100.00 at tonight's close; the first real print and the chart fill in at 6:00 PM ET.</div></div>`:''}
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px">Price-return NAV (no dividends), rebased to 100.00 at the ${f.baseline_date} baseline. Hover for daily values.</div>`;
  mount.querySelectorAll('.chip').forEach(c=>{
    if(!f.history.length){c.classList.add('locked');return;}
    c.onclick=()=>{series[c.dataset.s]=!series[c.dataset.s];c.classList.toggle('off',!series[c.dataset.s]);draw();};
  });
  const cv=$('#perf'), tip=$('#tip');
  const ctx=cv.getContext('2d');
  let W=0,H=0,dpr=1,hover=-1;

  function prep(){
    const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
    dpr=window.devicePixelRatio||1;
    cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw(){
    prep();
    ctx.clearRect(0,0,W,H);
    const padL=46,padR=14,padT=14,padB=26;
    const H0=f.history.length?f.history:[{nav:100,qqq_index_level:100,spy_index_level:100}];
    const lines=[['NAV','nav'],['QQQ','qqq_index_level'],['SPY','spy_index_level']];
    let mn=100,mx=100;
    H0.forEach(h=>{['nav','qqq_index_level','spy_index_level'].forEach(k=>{if(h[k]!=null){mn=Math.min(mn,h[k]);mx=Math.max(mx,h[k]);}});});
    mn=Math.min(mn,99.5); mx=Math.max(mx,100.5);
    const sp=(mx-mn)*0.12||0.5; mn-=sp; mx+=sp;
    const X=i=>padL+(H0.length<2?0:(W-padL-padR)*i/(H0.length-1));
    const Y=v=>padT+(H-padT-padB)*(1-(v-mn)/(mx-mn));
    // grid
    ctx.font='11px ui-monospace,Menlo,monospace'; ctx.fillStyle='#5B6B84';
    for(let g=0;g<=4;g++){
      const v=mn+(mx-mn)*g/4, y=Y(v);
      ctx.strokeStyle='#16202F';ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke();
      ctx.fillText(fmt(v,1),6,y+4);
    }
    // baseline
    ctx.strokeStyle='#2A3950';ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(padL,Y(100));ctx.lineTo(W-padR,Y(100));ctx.stroke();ctx.setLineDash([]);
    // series
    lines.forEach(([k,key])=>{
      if(!series[k]||!f.history.length&&k!=='NAV')return;
      ctx.strokeStyle=colors[k];ctx.lineWidth=k==='NAV'?2.4:1.4;ctx.beginPath();
      H0.forEach((h,i)=>{const v=h[key];if(v==null)return;i===0?ctx.moveTo(X(i),Y(v)):ctx.lineTo(X(i),Y(v));});
      ctx.stroke();
      const L=H0[H0.length-1];
      if(L[key]!=null){ctx.fillStyle=colors[k];ctx.beginPath();ctx.arc(X(H0.length-1),Y(L[key]),3.2,0,7);ctx.fill();}
    });
    // x labels
    if(f.history.length){
      const step=Math.max(1,Math.ceil(H0.length/6));
      ctx.fillStyle='#5B6B84';
      H0.forEach((h,i)=>{if(i%step===0||i===H0.length-1)ctx.fillText(dateLbl(h.date),X(i)-14,H-8);});
    } else {
      ctx.fillStyle='#5B6B84';ctx.fillText(dateLbl(f.baseline_date),padL,H-8);
    }
    // hover
    if(hover>=0&&f.history.length){
      const h=H0[hover];
      ctx.strokeStyle='#3A4A63';ctx.beginPath();ctx.moveTo(X(hover),padT);ctx.lineTo(X(hover),H-padB);ctx.stroke();
      lines.forEach(([k])=>{if(series[k]&&h[k==='NAV'?'nav':k==='QQQ'?'qqq_index_level':'spy_index_level']!=null){ctx.fillStyle=colors[k];ctx.beginPath();ctx.arc(X(hover),Y(h[k==='NAV'?'nav':k==='QQQ'?'qqq_index_level':'spy_index_level']),3.6,0,7);ctx.fill();}});
    }
    CHART={H0,X,Y,series,lines,mn,mx,padL,padR,padT,padB};
  }
  cv.onmousemove=e=>{
    if(!f.history.length||!CHART)return;
    const r=cv.getBoundingClientRect(),x=e.clientX-r.left;
    let best=-1,bd=1e9;
    CHART.H0.forEach((h,i)=>{const d=Math.abs(CHART.X(i)-x);if(d<bd){bd=d;best=i;}});
    hover=best;draw();
    const h=CHART.H0[best];
    let rows=`<div class="d">${new Date(h.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}</div>`;
    rows+=`<div class="r"><span style="color:${colors.NAV}">${f.ticker} NAV</span><span class="num">${fmt(h.nav)}</span></div>`;
    if(h.vs_qqq_pct!=null)rows+=`<div class="r"><span>vs QQQ</span><span class="num ${cls(h.vs_qqq_pct)}">${sgn(h.vs_qqq_pct)}</span></div>`;
    if(h.vs_spy_pct!=null)rows+=`<div class="r"><span>vs SPY</span><span class="num ${cls(h.vs_spy_pct)}">${sgn(h.vs_spy_pct)}</span></div>`;
    if(h.movers&&h.movers.best)rows+=`<div class="r" style="margin-top:4px;color:var(--muted)"><span>best ${esc(h.movers.best)}</span><span class="num ${cls(1)}">${esc(h.movers.best_pct!=null?sgn(h.movers.best_pct):'')}</span></div><div class="r" style="color:var(--muted)"><span>worst ${esc(h.movers.worst)}</span><span class="num ${cls(-1)}">${esc(h.movers.worst_pct!=null?sgn(h.movers.worst_pct):'')}</span></div>`;
    tip.innerHTML=rows;tip.style.display='block';
    tip.style.left=Math.min(r.width-150,Math.max(0,e.clientX-r.left+14))+'px';
    tip.style.top=Math.max(0,e.clientY-r.top-10)+'px';
  };
  cv.onmouseleave=()=>{hover=-1;tip.style.display='none';draw();};
  window.addEventListener('resize',draw);
  draw();
}

  <section class="panel"><h2>Sources &amp; Data Lineage</h2>
    ${CAT.funds.map(f=>`<div style="margin-bottom:12px;font-size:13.5px;color:#B9C6DA"><b style="color:${accentOf(f)}">${f.ticker}</b> — ${esc(f.sources)}</div>`).join('')}
  </section>`;
}

/* footnotes */
function renderFootnotes(){
  $('#footnotes').innerHTML = `<div style="font-weight:700;margin-bottom:8px;color:var(--ink)">Important disclosures (that nobody's lawyer wrote)</div>` +
    CAT.ops.footnotes.map((n,i)=>`<div class="fn">${i+1}. ${esc(n)}</div>`).join('') +
    `<div class="fn" style="margin-top:10px">Built by Pearl for the Snomo household · ${esc(CAT.as_of_label)}</div>`;
}

init();
renderFootnotes();
</script>
</body>
